prefs:
  # Keep Gecko's process and image caches within the Redmi TV's 3 GB RAM budget.
  fission.autostart: false
  dom.ipc.processCount: 2
  dom.ipc.processCount.webIsolated: 1
  dom.ipc.processPrelaunch.enabled: false
  image.mem.surfacecache.max_size_kb: 196608
  image.mem.surfacecache.min_expiration_ms: 15000
  media.memory_caches_combined_limit_kb: 131072
