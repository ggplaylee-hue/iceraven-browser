name: Build Iceraven TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/tv-browser

permissions:
  contents: read

concurrency:
  group: tv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tv-apk:
    name: Build armeabi-v7a APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK pieces
        run: ./automation/iceraven/install-sdk.sh

      - name: Create version name
        run: echo "VERSION_NAME=$(git describe --tags --always HEAD)" >> "$GITHUB_ENV"

      - name: Apply Iceraven patches
        run: ./automation/iceraven/patch_android_components.sh

      - name: Replace product strings
        run: |
          sed -i 's/Firefox/Iceraven TV/g' app/src/*/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/*/res/values*/*strings.xml
          sed -i '/<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%s/%1$s/g; /<string name="trackers_blocked_panel_categorical_num_trackers_blocked">/s/%d/%2$d/g' app/src/*/res/values*/*strings.xml

      - name: Build release APKs
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=3g -Xms1g -Xmx6g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dev/stderr"
        run: ./gradlew app:assembleForkRelease -PversionName="${VERSION_NAME}" --stacktrace --no-daemon

      - name: Sign armeabi-v7a APK
        env:
          TV_SIGNING_KEY: ${{ secrets.TV_SIGNING_KEY }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s' "$TV_SIGNING_KEY" | base64 --decode > tv-signing.p12
          UNSIGNED_APK=$(find gradle/build/app/outputs/apk/forkRelease -type f -name '*armeabi-v7a*.apk' | head -n 1)
          test -n "$UNSIGNED_APK"
          BUILD_TOOLS_VERSION=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" sign \
            --ks tv-signing.p12 \
            --ks-type PKCS12 \
            --ks-pass env:TV_KEYSTORE_PASSWORD \
            --key-pass env:TV_KEY_PASSWORD \
            --out artifacts/Iceraven-TV-armeabi-v7a.apk \
            "$UNSIGNED_APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose artifacts/Iceraven-TV-armeabi-v7a.apk
          rm -f tv-signing.p12

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Iceraven-TV-armeabi-v7a
          path: artifacts/Iceraven-TV-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30
